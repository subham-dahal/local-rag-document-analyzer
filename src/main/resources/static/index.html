<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local RAG Document Analyzer</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .chat-container { 
            width: 100%; 
            max-width: 600px; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            height: 80vh; 
            overflow: hidden; 
        }
        .chat-header { 
            background: #007bff; 
            color: white; 
            padding: 20px; 
            text-align: center; 
            font-size: 1.2rem; 
            font-weight: bold; 
        }
        .chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 8px; 
            max-width: 80%; 
            line-height: 1.5; 
        }
        .user-msg { 
            background: #007bff; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 0; 
        }
        .ai-msg { 
            background: #e9ecef; 
            color: #333; 
            align-self: flex-start; 
            border-bottom-left-radius: 0; 
        }
        .input-area { 
            display: flex; 
            padding: 15px; 
            background: #fff; 
            border-top: 1px solid #ddd; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            outline: none; 
            font-size: 1rem; 
        }
        button { 
            padding: 12px 20px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            margin-left: 10px; 
            cursor: pointer; 
            font-size: 1rem; 
            transition: 0.2s; 
        }
        button:hover { 
            background: #0056b3; 
        }
        .loading { 
            font-style: italic; 
            color: #888; 
            align-self: flex-start; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Document Analyzer AI</div>
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Hello! I have read your document. What would you like to know?</div>
        <div class="loading" id="loadingIndicator">Thinking...</div>
    </div>
    <div class="input-area">
        <input type="text" id="queryInput" placeholder="Ask a question about the document..." onkeypress="handleKeyPress(event)">
        <button onclick="askQuestion()">Send</button>
    </div>
</div>

<script>
    async function askQuestion() {
        const inputField = document.getElementById('queryInput');
        const query = inputField.value.trim();
        if (!query) return;

        appendMessage(query, 'user-msg');
        inputField.value = '';
        
        const loading = document.getElementById('loadingIndicator');
        loading.style.display = 'block';

        try {
            const response = await fetch(`/api/ask?query=${encodeURIComponent(query)}`);
            const answer = await response.text();
            appendMessage(answer, 'ai-msg');
        } catch (error) {
            appendMessage("Error connecting to the backend.", 'ai-msg');
        } finally {
            loading.style.display = 'none';
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.textContent = text;
        
        const loading = document.getElementById('loadingIndicator');
        chatBox.insertBefore(messageDiv, loading);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') askQuestion();
    }
</script>

</body>
</html>
