spring.application.name=document-analyzer

# Local Ollama models (pull them first: `ollama pull mistral && ollama pull mxbai-embed-large`)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=mistral
spring.ai.ollama.embedding.options.model=mxbai-embed-large

# Document to ingest on startup (any format Apache Tika can read)
app.document.location=classpath:docs/Document-Analyzer.pdf
